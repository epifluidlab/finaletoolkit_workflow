# Snakemake SLURM profile.  Run with:  snakemake --profile slurm_profile
executor: slurm

# Default config; override on the CLI with --configfile params.t2t-chm13.yaml (etc.)
configfile: "params.yaml"

jobs: 4

default-resources:
  # REQUIRED: set these to your cluster's account and partition before running.
  slurm_account: "CHANGE_ME"
  slurm_partition: "CHANGE_ME"
  
  # Per-job limits — raise these for whole-genome feature extraction. The tiny
  # defaults below only suit a trivial test; DELFI / end-motifs need more.
  mem_mb: 16000      # 16 GB per job
  runtime: 240       # minutes (4 h) per job
  cpus_per_task: 4

  tmpdir: "'./tmp'"
