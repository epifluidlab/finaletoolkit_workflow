name: finaletoolkit_workflow
channels:
  - conda-forge
  - bioconda
  - bioconda/label/cf201901
  - defaults
dependencies:
  - python=3.11
  - bioconda/label/cf201901::bedtools=2.26.0
  - htslib=1.21
  - samtools=1.21
  - openjdk=21
  - parallel
  - snakemake-executor-plugin-slurm=2.7.1
  - pip
  - pip:
    # FinaleToolkit pulls in its own numpy (>=2), pysam, and pyBigWig.
    - finaletoolkit
    - snakemake==8.27.1